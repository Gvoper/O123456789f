plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 17 to end users in 1.18+, so your mod should target Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    // Стандартный Maven Central
    mavenCentral()

    // Jitpack (некоторые либы тянутся отсюда)
    maven { url = 'https://jitpack.io' }

    // Curse Maven (для загрузки модов с CurseForge)
    maven {
        name = "CurseMaven"
        url = "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }

    // Modrinth Maven
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    maven { url = 'https://repo.spongepowered.org/maven' } // для mixin
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    annotationProcessor "org.spongepowered:mixin:0.8.5"
    implementation "org.spongepowered:mixin:0.8.5"

    implementation "com.google.code.gson:gson:2.8.9"
    annotationProcessor "com.google.code.gson:gson:2.8.9"

    implementation 'com.google.guava:guava:32.1.2-jre'

    compileOnly 'com.google.guava:guava:32.1.2-jre'
    annotationProcessor 'com.google.guava:guava:32.1.2-jre'

    implementation "org.ow2.asm:asm:9.5"
    implementation "org.ow2.asm:asm-tree:9.5"

    annotationProcessor "org.ow2.asm:asm:9.5"
    annotationProcessor "org.ow2.asm:asm-tree:9.5"


// https://mvnrepository.com/artifact/com.github.LlamaLad7.MixinExtras/mixinextras-forge
    implementation 'com.github.LlamaLad7.MixinExtras:mixinextras-forge:0.2.2'
// https://mvnrepository.com/artifact/com.github.LlamaLad7.MixinExtras/mixinextras-common
    implementation 'com.github.LlamaLad7.MixinExtras:mixinextras-common:0.2.2'

    // Ars Nouveau
    implementation fg.deobf("curse.maven:ars-nouveau-401955:6688854")

    // EMI
   implementation fg.deobf("curse.maven:emi-580555:6420945")

    // Applied Energistics 2
    implementation fg.deobf("curse.maven:applied-energistics-2-223794:6852919")

    // Sophisticated Backpacks (и Core)
    implementation fg.deobf("curse.maven:sophisticated-backpacks-422301:6869024")
    implementation fg.deobf("curse.maven:sophisticated-core-618298:6859221")
}

mixin {
    // генерирует refmap и включает mixins файл в jar
    add sourceSets.main, 'o123456789f.refmap.json'
    config 'o123456789f.mixins.json'
    debug {
        export = true
        verbose = true
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}